<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CINDER LOOP — Ember Dash / Parry preview (throwaway prototype, not shipped source)</title>
<style>
  html, body { margin:0; padding:0; background:#0d0b10; overflow:hidden; height:100%; }
  #stage { display:block; margin:0 auto; image-rendering: pixelated; }
  #wrap { display:flex; align-items:center; justify-content:center; height:100%; }
</style>
</head>
<body>
<div id="wrap"><canvas id="stage" width="960" height="400"></canvas></div>
<script>
// ---------------------------------------------------------------------------
// THROWAWAY VISUAL-DIRECTION PROTOTYPE — not part of the shipped game source.
// Reuses CINDER LOOP's real, established palette (80-view.js's own COLOR
// table: "ash-cloth over a banked ember") and figure silhouette by hand,
// purely to preview how Ember Dash / Parry could read on the existing
// hooded character. Hand-keyframed, not driven by the real rig/physics.
// ---------------------------------------------------------------------------
var ctx = document.getElementById('stage').getContext('2d');
var W = 960, H = 400;
var GROUND = 300;

var COLOR = {
  bg: '#0d0b10',
  ground: '#1a1620',
  groundLine: '#443a52',
  cloth: '#e8d8b0',
  clothDark: '#7d6d52',
  limbNear: '#b09775',
  limbFar: '#6a5c47',
  hood: '#221c29',
  hoodLit: '#4a2530',
  ember: '#d1495b',
  emberHot: '#ff9a5c',
  bladeHot: '#fff4d6',
  hudInk: '#e8d8b0',
  hudDim: '#8b8194',
  warn: '#ffd166'
};

function font(px, w) { return (w || '') + ' ' + px + 'px ui-monospace, Consolas, monospace'; }

// -------------------------------------------------------------- the figure
// A simplified stand-in for 35-rig.js's real posed skeleton: a hood circle
// (with a single ember-glow dot, brighter or fuller depending on state), a
// tapered cloak/torso, and four limb lines. `x` is world position (px),
// `stretch` widens the silhouette for the dash burst, `hoodGlow` is 0..1
// (0 = the ordinary single dot, 1 = the whole hollow lit).
function drawFigure(x, y, facing, stretch, hoodGlow, emberBoost) {
  facing = facing || 1;
  stretch = stretch || 1;
  hoodGlow = hoodGlow || 0;
  emberBoost = emberBoost || 0;

  var hx = x, hy = y - 46;
  var hoodR = 13;

  // far limbs
  ctx.strokeStyle = COLOR.limbFar; ctx.lineWidth = 5; ctx.lineCap = 'round';
  line(x - 4 * facing, y - 26, x - 10 * facing * stretch, y);
  line(x + 6 * facing, y - 30, x + 14 * facing * stretch, y - 8);

  // cloak / torso — a tapered trapezoid, wider at the shoulders
  ctx.fillStyle = COLOR.clothDark;
  ctx.beginPath();
  ctx.moveTo(x - 14 * stretch, y - 40);
  ctx.lineTo(x + 14 * stretch, y - 40);
  ctx.lineTo(x + 10 * stretch, y - 4);
  ctx.lineTo(x - 10 * stretch, y - 4);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = COLOR.cloth;
  ctx.beginPath();
  ctx.moveTo(x - 11 * stretch, y - 38);
  ctx.lineTo(x + 11 * stretch, y - 38);
  ctx.lineTo(x + 8 * stretch, y - 8);
  ctx.lineTo(x - 8 * stretch, y - 8);
  ctx.closePath();
  ctx.fill();

  // hood
  ctx.fillStyle = COLOR.hood;
  ctx.beginPath(); ctx.arc(hx, hy, hoodR + 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = hoodGlow > 0 ? lerpColor(COLOR.hood, COLOR.hoodLit, hoodGlow) : COLOR.hood;
  ctx.beginPath(); ctx.arc(hx + facing * 1.5, hy + 1, hoodR - 1, 0, Math.PI * 2); ctx.fill();

  if (hoodGlow > 0) {
    // the whole hollow lights up on a good parry read
    ctx.fillStyle = 'rgba(255,244,214,' + (0.15 + hoodGlow * 0.5) + ')';
    ctx.beginPath(); ctx.arc(hx + facing * 1.5, hy + 1, hoodR - 2, 0, Math.PI * 2); ctx.fill();
  }
  // the banked ember — a small hot square, brighter/bigger with emberBoost
  var es = 3 + emberBoost * 3.5;
  ctx.fillStyle = emberBoost > 0.4 ? COLOR.bladeHot : COLOR.ember;
  ctx.fillRect(hx + facing * 3 - es / 2, hy - es / 2, es, es);

  // near limbs (drawn over the cloak)
  ctx.strokeStyle = COLOR.limbNear; ctx.lineWidth = 6; ctx.lineCap = 'round';
  line(x - 3 * facing, y - 24, x - 8 * facing * stretch, y + 2);
  line(x + 5 * facing, y - 28, x + 16 * facing * stretch, y - 6);
}

function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }

function lerpColor(a, b, t) {
  var pa = hexToRgb(a), pb = hexToRgb(b);
  var r = Math.round(pa[0] + (pb[0] - pa[0]) * t);
  var g = Math.round(pa[1] + (pb[1] - pa[1]) * t);
  var bl = Math.round(pa[2] + (pb[2] - pa[2]) * t);
  return 'rgb(' + r + ',' + g + ',' + bl + ')';
}
function hexToRgb(h) {
  h = h.replace('#', '');
  return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)];
}

// ------------------------------------------------------------- ember trail
// A lightweight stand-in for 80-view.js's real particle system — a pool of
// fading ember-colored puffs left behind during the dash burst.
var particles = [];
function spawnTrail(x, y) {
  particles.push({ x: x, y: y, r: 14 + Math.random() * 6, life: 1, vx: -2 - Math.random() * 1.5 });
}
function stepParticles(dt) {
  for (var i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    p.life -= dt * 1.6;
    p.x += p.vx;
    if (p.life <= 0) particles.splice(i, 1);
  }
}
function drawParticles() {
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    ctx.fillStyle = 'rgba(209,73,91,' + (p.life * 0.5) + ')';
    ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r * p.life, p.r * 0.55 * p.life, 0, 0, Math.PI * 2); ctx.fill();
  }
}

// ---------------------------------------------------------------- HUD text
function drawLabel(text, sub, alpha) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.textAlign = 'center';
  ctx.fillStyle = COLOR.warn;
  ctx.font = font(22, '600');
  ctx.fillText(text, W / 2, 70);
  if (sub) {
    ctx.fillStyle = COLOR.hudDim;
    ctx.font = font(12);
    ctx.fillText(sub, W / 2, 92);
  }
  ctx.restore();
}

// ------------------------------------------------------------- the timeline
// Simple phase list, each { name, dur (ms) }. `t` below tracks ms into the
// CURRENT phase; the loop wraps back to phase 0 at the end.
var PHASES = [
  { name: 'idle', dur: 700 },
  { name: 'dashWindup', dur: 140 },
  { name: 'dash', dur: 260 },
  { name: 'dashSettle', dur: 500 },
  { name: 'telegraph', dur: 550 },
  { name: 'parryWindow', dur: 160 },
  { name: 'parryHit', dur: 420 },
  { name: 'parryRecover', dur: 700 }
];
var phaseIndex = 0, phaseT = 0, last = null;
var px = 260, py = GROUND;
var facing = 1;

function ease(t) { return t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t); }

function frame(now) {
  if (!last) last = now;
  var dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  var phase = PHASES[phaseIndex];
  phaseT += dt * 1000;
  if (phaseT >= phase.dur) {
    phaseT = 0;
    phaseIndex = (phaseIndex + 1) % PHASES.length;
    if (PHASES[phaseIndex].name === 'idle') { px = 260; facing = 1; }
  }
  phase = PHASES[phaseIndex];
  var u = phaseT / phase.dur; // 0..1 through this phase

  stepParticles(dt);

  // -------------------------------------------------------------- update
  var stretch = 1, hoodGlow = 0, emberBoost = 0.15;
  var labelText = '', labelSub = '', labelAlpha = 0;
  var telegraphX = 780, showTelegraph = false, showParryFlash = false, showDeflect = false;

  if (phase.name === 'idle') {
    // a small idle bob
    py = GROUND + Math.sin(now / 260) * 1.5;
  } else if (phase.name === 'dashWindup') {
    emberBoost = 0.15 + ease(u) * 0.5;
    stretch = 1 - ease(u) * 0.08;
  } else if (phase.name === 'dash') {
    var startX = 260, endX = 560;
    px = startX + (endX - startX) * ease(u);
    stretch = 1.5;
    emberBoost = 1;
    labelText = 'EMBER DASH'; labelSub = 'roll button, airborne — i-frames + ember trail'; labelAlpha = 1;
    if (Math.random() < 0.9) spawnTrail(px - 30 * facing, py - 20);
  } else if (phase.name === 'dashSettle') {
    px = 560 - (1 - ease(Math.min(1, u * 2))) * 20;
    emberBoost = Math.max(0.15, 1 - ease(u));
    labelText = 'EMBER DASH'; labelSub = 'roll button, airborne — i-frames + ember trail';
    labelAlpha = Math.max(0, 1 - u * 1.4);
  } else if (phase.name === 'telegraph') {
    showTelegraph = true;
    telegraphX = 780 - ease(u) * 60;
    labelText = 'ENEMY TELEGRAPHS'; labelSub = 'the same real Bus event 82-narrative.js already reacts to';
    labelAlpha = Math.min(1, u * 3);
  } else if (phase.name === 'parryWindow') {
    showTelegraph = true;
    telegraphX = 720 - ease(u) * 140;
    labelText = 'PARRY WINDOW'; labelSub = 'new dedicated input — timed to the telegraph';
    labelAlpha = 1;
  } else if (phase.name === 'parryHit') {
    hoodGlow = Math.max(0, 1 - ease(u) * 1.3);
    showParryFlash = u < 0.5;
    showDeflect = true;
    labelText = 'PARRY'; labelSub = 'the whole hood-hollow lights up on a good read';
    labelAlpha = 1;
  } else if (phase.name === 'parryRecover') {
    hoodGlow = 0;
    labelAlpha = Math.max(0, 1 - u * 1.6);
    labelText = 'PARRY'; labelSub = 'the whole hood-hollow lights up on a good read';
  }

  // -------------------------------------------------------------- draw
  ctx.fillStyle = COLOR.bg; ctx.fillRect(0, 0, W, H);

  // ground
  ctx.fillStyle = COLOR.ground; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.strokeStyle = COLOR.groundLine; ctx.lineWidth = 2;
  line(0, GROUND, W, GROUND);

  drawParticles();

  if (showTelegraph) {
    ctx.save();
    ctx.translate(telegraphX, GROUND - 40);
    ctx.rotate(Math.PI / 4);
    ctx.fillStyle = COLOR.warn;
    ctx.globalAlpha = 0.5 + 0.5 * Math.abs(Math.sin(now / 90));
    ctx.fillRect(-7, -7, 14, 14);
    ctx.restore();
    ctx.strokeStyle = COLOR.limbFar; ctx.lineWidth = 6; ctx.lineCap = 'round';
    line(telegraphX, GROUND - 40, telegraphX, GROUND - 4);
  }

  drawFigure(px, py, facing, stretch, hoodGlow, emberBoost);

  if (showParryFlash) {
    ctx.save();
    ctx.globalAlpha = 0.6;
    ctx.strokeStyle = COLOR.bladeHot; ctx.lineWidth = 2;
    for (var ring = 0; ring < 2; ring++) {
      ctx.beginPath();
      ctx.arc(px, py - 46, 24 + ring * 14 + (phaseT % 420) / 6, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }
  if (showDeflect) {
    ctx.strokeStyle = COLOR.hudDim; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
    line(720, GROUND - 100, px + 30, py - 55);
    ctx.setLineDash([]);
  }

  drawLabel(labelText, labelSub, labelAlpha);

  // footer
  ctx.textAlign = 'left';
  ctx.fillStyle = COLOR.hudDim;
  ctx.font = font(11);
  ctx.fillText('CINDER LOOP — visual-direction prototype, looping — not shipped game code', 16, H - 14);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
